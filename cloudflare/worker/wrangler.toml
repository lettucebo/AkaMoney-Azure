name = "akamoney-api"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Workers Free plan limits
# - 100,000 requests/day
# - 10ms CPU time per invocation

[vars]
# Azure Entra ID configuration (override in .dev.vars for local development)
AZURE_TENANT_ID = ""
AZURE_CLIENT_ID = ""

# KV Namespace for short URLs
[[kv_namespaces]]
binding = "SHORTURL_KV"
id = "0de8694fdd794c1893c3f709ecf722d9"
preview_id = "118ec6fab2cc4cdfa648fadf68d22cfa"

# D1 Database for click tracking
[[d1_databases]]
binding = "CLICKS_DB"
database_name = "akamoney-clicks"
database_id = "131d3b75-59f5-41f2-863b-c5743c248349"

[dev]
port = 8787
local_protocol = "http"
