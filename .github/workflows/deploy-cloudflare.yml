name: Deploy to Cloudflare

on:
  push:
    tags:
      - '*'  # Trigger on version tags like v1.0.0, v1.2.3
  workflow_dispatch:  # Allow manual trigger
    inputs:
      deploy_workers:
        description: 'Deploy Workers API'
        type: boolean
        default: true
      deploy_pages:
        description: 'Deploy Frontend (Pages)'
        type: boolean
        default: true
      run_migrations:
        description: 'Run D1 Migrations'
        type: boolean
        default: false

env:
  NODE_VERSION: '20'

jobs:
  # Deploy Cloudflare Workers API
  deploy-workers:
    name: Deploy Workers API
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_workers)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/cloudflare/worker/package-lock.json

      - name: Install dependencies
        working-directory: src/cloudflare/worker
        run: npm ci

      - name: Run TypeScript check
        working-directory: src/cloudflare/worker
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: src/cloudflare/worker
          command: deploy
          secrets: |
            AZURE_TENANT_ID
            AZURE_CLIENT_ID
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}

  # Deploy Frontend to Cloudflare Pages
  deploy-pages:
    name: Deploy Frontend (Pages)
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/akamoney-frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/akamoney-frontend
        run: npm ci

      - name: Build frontend
        working-directory: src/akamoney-frontend
        run: npm run build
        env:
          VUE_APP_API_URL: ${{ vars.VUE_APP_API_URL }}
          VUE_APP_CLIENT_ID: ${{ vars.VUE_APP_CLIENT_ID }}
          VUE_APP_TENANT_ID: ${{ vars.VUE_APP_TENANT_ID }}
          VUE_APP_API_CLIENT_ID: ${{ vars.VUE_APP_API_CLIENT_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=akamoney-frontend
          workingDirectory: src/akamoney-frontend

  # Run D1 migrations
  migrate-d1:
    name: Run D1 Migrations
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_migrations
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Run D1 migrations
        working-directory: src/cloudflare/worker
        run: |
          for migration in ../migrations/*.sql; do
            echo "Running migration: $migration"
            wrangler d1 execute akamoney-clicks --file="$migration" --remote
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
